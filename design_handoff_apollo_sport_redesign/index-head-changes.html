<!-- ═══ index.html — 3 thay đổi trong <head> ═══════════════════════════════ -->

<!-- 1) THÊM: font (đặt ngay sau <title>) -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="./src/ui/fonts.css" rel="stylesheet" />

<!-- 2) SỬA: theme-color + tiêu đề -->
<title>Apollo Sport</title>
<meta name="apple-mobile-web-app-title" content="Apollo Sport" />
<meta name="theme-color" content="#2576B9" />
