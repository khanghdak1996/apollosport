<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>GymPair</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="GymPair" />
  <meta name="theme-color" content="#ffffff" />
  <style>
    :root {
      --accent: #0084ff;
      --accent-glow: rgba(0, 132, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body,
    #root {
      height: 100%;
      width: 100%;
      background: #f1f5f9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #0f172a;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    input,
    button,
    textarea {
      font-family: inherit;
    }

    input:focus,
    button:focus {
      outline: none;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    /* Animations */
    .fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }

    .slide-up {
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .slide-in-right {
      animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .scale-in {
      animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .checkmark-pop {
      animation: checkmarkPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .pulse-glow {
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes checkmarkPop {
      0% {
        transform: scale(0.85);
      }

      50% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 0 0 var(--accent-glow);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(0, 0, 0, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
      }
    }

    @keyframes pulseRedGlow {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.25);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    .pulse-red-glow {
      animation: pulseRedGlow 1.5s infinite ease-in-out;
    }

    /* Confetti effect */
    .confetti-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 9999;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    .confetti-piece {
      position: absolute;
      width: 8px;
      height: 12px;
      opacity: 0.85;
      animation: confettiFall 2.8s linear forwards;
    }

    /* Button & Card Micro-interactions */
    .btn-action {
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s, opacity 0.15s, box-shadow 0.2s;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    .card-hover {
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s, border-color 0.2s;
    }

    .card-hover:active {
      transform: scale(0.98);
    }

    /* Custom styled inputs */
    .workout-input {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #0f172a;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s, color 0.2s;
    }

    .workout-input:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 8px var(--accent-glow);
      background: #ffffff;
    }

    .workout-input-done {
      background: #e6f9f3 !important;
      color: #10b981 !important;
      border-color: #a7f3d0 !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="importmap">
    {
      "imports": {
        "preact": "https://esm.sh/preact@10.24.3",
        "preact/hooks": "https://esm.sh/preact@10.24.3/hooks",
        "htm": "https://esm.sh/htm@3.1.1",
        "fb/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
        "fb/auth": "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js",
        "fb/firestore": "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js",
        "fb/storage": "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
